<!DOCTYPE html>
<meta charset="utf-8" />
<html>
<head>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=Cinzel:wght@400;600;700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  height: 100%;
}

body {
  background: rgba(0, 0, 0, 0);
  overflow: hidden;
}

.wrapper {
  position: absolute;
  top: 100%;
  width: 100%;
  font-family: 'Cinzel', serif;
  font-size: 34px;
  line-height: 1.15;
  text-align: center;
  text-transform: uppercase;
  color: #fff;
  text-shadow:
    0 0 8px rgba(0,0,0,0.9),
    0 0 14px rgba(0,0,0,0.7);
}

.title {
  margin-top: 70px;
  margin-bottom: 18px;
  font-family: 'Pirata One', cursive;
  font-size: 100px;
  font-weight: bold;
  letter-spacing: 4px;
  color: #fdb415;
  -webkit-text-stroke: 1px rgba(0,0,0,0.3);
  text-shadow:
    0 0 8px rgba(0,0,0,0.95),
    0 0 18px rgba(139,0,0,0.55),
    0 0 28px rgba(212,175,55,0.25);
}

.name {
  margin-bottom: 18px;
  font-family: 'Cinzel', serif;
  font-size: 66px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #fff;
  text-shadow:
    0 0 6px rgba(0,0,0,1),
    0 0 12px rgba(0,0,0,1);
}

.emote-entry {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 18px;
}

.emote-img {
  height: 64px;
  width: 64px;
  image-rendering: auto;
}
</style>
<script language="javascript" type="text/javascript">

function getParameterCaseInsensitive(object, key) {
  return object[Object.keys(object)
    .find(k => k.toLowerCase() === key.toLowerCase())
  ];
}

// Create WebSocket connection.
const socket = new WebSocket('ws://localhost:8080');

// get messages from the CPH socket
socket.onmessage = async function (event) {
	const msg = JSON.parse(event.data);
	console.log('Message from server: ', msg);

	if (msg.id === 'credits') {
		// close the socket
		socket.close();

		// fetch emote data written by Streamer.bot Action 2
		// Wait 2000ms so Action 2 has time to write emotes.json before we read it.
		// Action 2 runs after a 1500ms sleep in Streamer.bot, so this margin is needed.
		try {
			await new Promise(resolve => setTimeout(resolve, 2000));
			const resp = await fetch('./emotes.json?t=' + Date.now());
			if (resp.ok) {
				const emotes = await resp.json();
				if (emotes.length > 0) {
					if (!msg.custom) msg.custom = {};
					msg.custom['Top Emotes'] = emotes;
				}
			}
		} catch(e) {
			console.log('No emote data:', e);
		}

		const headers = [
			{ section: "events", key: "follows", title: "Neue Follower" },
			{ section: "events", key: "cheers", title: "Cheers" },
			{ section: "events", key: "subs", title: "Neue Abonnenten" },
			{ section: "events", key: "reSubs", title: "Erneut Abonniert" },
			{ section: "events", key: "giftSubs", title: "Geschenkte Subs" },
			{ section: "events", key: "giftBombs", title: "Sub Bomben" },
			{ section: "events", key: "raided", title: "Unsere Raider" },
			{ section: "events", key: "rewardRedemptions", title: "Berries Verprasst" },
			{ section: "events", key: "goalContributions", title: "Ziele Unterstützt" },
			{ section: "events", key: "pyramids", title: "Pyramiden Meister" },
			{ section: "users", key: "editors", title: "Editoren" },
			{ section: "users", key: "moderators", title: "Moderatoren", filterExistingEntries: true },
			{ section: "users", key: "subscribers", title: "Abonnenten" },
			{ section: "users", key: "vips", title: "VIPs", filterExistingEntries: true },
			{ section: "groups", key: "<group name>", title: "<group title>" },
			{ section: "users", key: "users", title: "Zuschauer", filterExistingEntries: true },
			{ section: "hypeTrain", key: "conductors", title: "Hype Train Lokführer" },
			{ section: "hypeTrain", key: "contributors", title: "Hype Train Fahrer" },
			{ section: "top", key: "allBits", title: "Bits Legenden" },
			{ section: "top", key: "monthBits", title: "Top Bits des Monats" },
			{ section: "top", key: "weekBits", title: "Top Bits der Woche" },
			{ section: "top", key: "channelRewards", title: "Berries Legenden" },
			{ section: "custom", key: "Top Emotes", title: "Top Emotes", render: entry => `<div class="emote-entry"><img src="${entry.Url}" alt="${entry.Name}" class="emote-img"><span>${entry.Count}x</span></div>` }
		];

		// Generate DOM
		const container = document.getElementById('credits');
		const existingUserMap = {};
		const elements = [];
		for (const header of headers) {
			const headerSection = getParameterCaseInsensitive(msg, header.section);
			if (headerSection) {
				let eventData = getParameterCaseInsensitive(headerSection, header.key);
				if (!eventData) continue;

				// filter existing entries in the current section
				if (header.filterExistingEntries) eventData = eventData.filter(e => !existingUserMap[header.section] || !existingUserMap[header.section].includes(e));
				if (eventData.length > 0) {
					elements.push(`
						<div class="title">${ header.title }</div>
						${Object.values(eventData).map(entry => header.render ? header.render(entry) : `<div class="name">${ entry }</div>`).join('')}
					`);

					// save output users by section
					if (!existingUserMap[header.section]) existingUserMap[header.section] = [];
					existingUserMap[header.section].push(...eventData);
				}
			}
		}
		container.innerHTML = elements.join('');

		// Init animation
		const creditsHeight = Math.ceil((container.offsetHeight / window.innerHeight) * -100) - 10;
		const duration = ((container.offsetHeight / window.innerHeight * 100) + 100) * 160;
		const creditsAnimation = container.animate([
				{ top: '110%' },
				{ top: creditsHeight + '%' }
			],{
				duration: duration,
				iterations: Infinity
			}
		);
	}
}

// Set the Request
socket.onopen = function (event) {
	const msg = {
		id: 'credits',
		request: 'GetCredits'
	};
	socket.send(JSON.stringify(msg));
};
</script>
</head>
<body>
	<div id="credits" class="wrapper"></div>
</body>
</html>
